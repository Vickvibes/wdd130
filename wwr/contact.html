<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Contact Vickvibe Rafting Company for information about our river adventures.">
    <meta name="author" content="Ojutiku Victor Oluwaseun">
    <title>Contact Us | Vickvibe Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/logo.jpg" alt="Rafting company logo">
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-details">
                <h1>Vickvibe Rafting Company</h1>
                <address>
                    123 Main River Street<br>
                    Kolob, California
                </address>
                <p><a href="tel:+2349164713581">+234 916 471 3581</a></p>
                <p><a href="mailto:infovickvibe@gmail.com">infovickvibe@gmail.com</a></p>
        </section>

        <section class="contact-section">
            <div class="contact-map">
                <iframe
                    src="https://www.google.com/maps?q=123+Main+River+Street,+Kolob,+California&output=embed"
                    title="Map showing the location of Vickvibe Rafting Company"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <form class="contact-form" action="#" method="post">
                <div class="form-field">
                    <label for="visitor-name">Name</label>
                    <input type="text" id="visitor-name" name="visitor-name" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="visitor-email">Email</label>
                    <input type="email" id="visitor-email" name="visitor-email" autocomplete="email" required>
                </div>
                <fieldset class="purpose-field">
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="message-purpose" value="general-inquiry" required> General Inquiry</label>
                    <label><input type="radio" name="message-purpose" value="reservation-question"> Reservation Question</label>
                    <label><input type="radio" name="message-purpose" value="website-suggestion"> Website Suggestion</label>
                </fieldset>
                <div class="form-field">
                    <label for="visitor-message">Message</label>
                    <textarea id="visitor-message" name="visitor-message" rows="4" placeholder="Type here" required></textarea>
                </div>
                <label class="newsletter-option" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter.
                </label>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/rafting-enjoy.jpg" alt="Rafting group; replace with an employee portrait">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-flex1.jpg" alt="Rafting group; replace with an employee portrait">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-flex2.webp" alt="Rafting group; replace with an employee portrait">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026, Vickvibe Rafting Company | Ojutiku Victor Oluwaseun</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
